[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. Kept to the build plugin only: it is a direct dependency
# (vite.config.ts) that Lovable republishes frequently, so the guard would
# otherwise block routine installs. The former mcp-js / email-js / webhooks-js
# / cloud-auth-js entries were removed — none of them are dependencies of this
# project, and an exclude for a package you do not install is dead config that
# silently pre-authorises a future supply-chain risk.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config"]
