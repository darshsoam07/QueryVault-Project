<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueryVault invites you</title>
  </head>
  <body style="margin: 0; background: #10111b; color: #f4f3ff; font-family: Arial, sans-serif">
    <main style="max-width: 560px; margin: 0 auto; padding: 48px 24px">
      <div
        style="padding: 32px; border: 1px solid #35364a; border-radius: 16px; background: #171927"
      >
        <p style="margin: 0 0 20px; color: #a9a5ff; font-size: 18px; font-weight: 700">
          QueryVault
        </p>
        <h1 style="margin: 0 0 16px; font-size: 28px">QueryVault invites you</h1>
        <p style="margin: 0 0 24px; color: #c4c2d5; line-height: 1.6">
          You're invited to QueryVault. Confirm your email to finish creating your account and start
          getting cited answers from your own documents.
        </p>
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            padding: 13px 20px;
            border-radius: 10px;
            background: #8b7cff;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
          "
        >
          Accept invite &amp; confirm email
        </a>
        <p style="margin: 28px 0 0; color: #85839a; font-size: 12px; line-height: 1.5">
          If you did not create a QueryVault account, you can safely ignore this email.
        </p>
      </div>
    </main>
  </body>
</html>
